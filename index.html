<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070c" />
  <title>Pixel Patrol</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-label="Pixel Patrol arcade game">
    <header class="game-header">
      <div class="brand" aria-label="Pixel Patrol">
        <span class="brand-mark" aria-hidden="true">▟▙</span>
        <span>PIXEL PATROL</span>
      </div>
      <div class="hud" aria-live="polite">
        <span>SCORE <b id="score">1000</b></span>
        <span>LEVEL <b id="level">1</b></span>
        <span>LIVES <b id="lives">10</b></span>
      </div>
    </header>

    <section class="game-wrap">
      <canvas id="game" width="960" height="640" aria-label="Pixel Patrol game area"></canvas>

      <div id="startOverlay" class="overlay shown">
        <div class="panel">
          <h1>PIXEL PATROL</h1>
          <p class="tagline">Defend the stars. Clear the swarm.</p>
          <p><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move &nbsp;•&nbsp; <kbd>SPACE</kbd> to fire</p>
          <p><kbd>P</kbd> pause &nbsp;•&nbsp; <kbd>R</kbd> restart</p>
          <button id="startButton" type="button">START MISSION</button>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay">
        <div class="panel">
          <h2>MISSION OVER</h2>
          <p>FINAL SCORE <strong id="finalScore">0</strong></p>
          <label for="initials">ENTER INITIALS</label>
          <input id="initials" maxlength="3" autocomplete="off" inputmode="text" aria-label="Three initials for leaderboard" />
          <button id="saveScoreButton" type="button">SAVE SCORE</button>
          <button id="playAgainButton" type="button" class="secondary">PLAY AGAIN</button>
        </div>
      </div>

      <div id="levelOverlay" class="level-card" aria-live="assertive"></div>
    </section>

    <section class="below-game">
      <div class="instructions">
        <h2>SCORING</h2>
        <div class="score-key">
          <span><i class="dot small"></i> Scout +100</span>
          <span><i class="dot medium"></i> Striker +200</span>
          <span><i class="dot large"></i> Brute +400</span>
          <span><i class="dot bonus"></i> Bonus ship +1000</span>
        </div>
      </div>
      <div class="leaderboard">
        <h2>HIGH SCORES</h2>
        <ol id="leaderboard"></ol>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
